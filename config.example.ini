; ============================================================================
;  AI Snap settings
;
;  This is the starting point. On first run it's copied to config.ini next to
;  the script, and that copy is the one AI Snap reads and writes - so your own
;  settings are never overwritten when you update.
;
;  Easiest way to change these: click the tray icon (Settings...).
;  If you edit config.ini by hand, save it then use tray > Reload.
;
;  Hotkey symbols:
;     ^ = Ctrl     ! = Alt     + = Shift     # = Windows key
;  Examples:
;     !1    = Alt + 1
;     ^!s   = Ctrl + Alt + S      (careful: can clash with AltGr keyboards)
;     +#a   = Shift + Win + A
; ============================================================================

[Hotkeys]
; Talk to your AI. Brings the chat up, then you dictate with your usual
; push-to-talk key (see [Dictation] below) and it sends what you said.
Dictate =!1

; Snip a region of your screen and drop it into your AI chat.
SnipAndSend =!2

; Copy the text you have highlighted right now and send it.
CopySelection =!3

; Select everything on the current page, copy it, and send it.
CopyAllOnPage =!4

; Send the message by hand - only needed if AutoSend is turned off.
Post =!0

; Start (and stop) filling. While it's on, every single thing you copy lands
; in your chosen app and then moves to the next cell. See [Fill] below.
Fill =!9

[Target]
; Which app to send to. "Auto" uses whichever app below you used most
; recently, so you can bounce between them without changing anything.
; To pin one, put its name here exactly, e.g.  Active = Claude
Active =Auto

[Apps]
; The apps AI Snap can send to. Not just AI chats - Word, Excel, Notepad,
; anything. Easiest way to add one: Settings > Send to > "Running apps",
; then click the one you want.
;
;   Name = window | how to start it | press Enter? | where to type?
;
; Only the window part is required.
;
; The window part is usually  ahk_exe TheApp.exe  - you can also match on
; window title, e.g.  Gemini ahk_exe chrome.exe
; The launch part is either a full path to an .exe or .lnk, or an app id you
; can find by running this in PowerShell:   Get-StartApps
; The Enter part is 1 for chat boxes (Enter sends the message) or 0 for
; documents, where Enter would just leave a blank line. Left out = 1.
; The "where to type" part is a spot to click before typing, written as a
; fraction of the window - 0.5,0.92 is halfway across and near the bottom, so
; it still lands after you move or resize the window. Set it in Settings with
; the "where to type" button; leave it out and nothing is clicked.
;
; Delete any you don't use, and add your own the same way.
Claude = ahk_exe Claude.exe | Claude_pzs8sxrjxfjjc!Claude
ChatGPT = ahk_exe Codex.exe | OpenAI.Codex_2p2nqsd0c76g0!App
ChatGPT Classic = ahk_exe ChatGPT Classic.exe | OpenAI.ChatGPT-Desktop_2p2nqsd0c76g0!ChatGPT
Antigravity = ahk_exe Antigravity.exe | Google.Antigravity

[Fill]
; Filling mode: turn it on, then just copy. Each copy is pasted into your
; chosen app and then this key is pressed to move on. Tab goes across a
; spreadsheet row, Enter goes down, Down goes down a list, None just pastes.
Advance = Tab

; Stop filling by itself after this many seconds with nothing copied, so it's
; never left armed by accident. 0 = never stop on its own.
Timeout = 120

[Look]
; How the AI Snap windows look. Pick one in Settings, or type it here:
;   Claude Code   warm dark with the Claude orange (the default)
;   Codex         near-black terminal look, monospaced, green
;   Gemini        cool dark grey with Google blue
Theme =Claude Code

[Dictation]
; Your dictation app's push-to-talk key - whatever you set in Handy.
; (Handy > General > Transcribe Shortcut. Default there is ctrl+space.)
Key =F4

; How long to wait after you stop talking, in milliseconds, so the app has
; time to transcribe and type before we hit Enter. Raise it if messages get
; sent half-finished; lower it if you're left waiting.
Wait = 2500

[Behavior]
; 1 = a small "Send to AI" box opens when you snip or copy, so you can type a
;     note first. Grab as much as you like - snips, highlighted text, whole
;     pages - and it all goes across together when you hit Send (recommended).
; 0 = straight through to the AI app, no box.
Composer =1

; How long to wait after pasting a screenshot, in milliseconds, before the next
; paste or Enter. Raise it if images arrive half-attached or get left behind.
AttachWait = 400

; 1 = send to the AI automatically after every action (recommended).
; 0 = drop it in the box so you can add text first, then press the Post key.
; (Ignored when Composer = 1 - there, Send always sends.)
AutoSend =1

; 1 = jump back to whatever you were doing after each action (recommended).
; 0 = stay on the AI app.
RestoreFocus =1

; Set to 1 once you've seen the short hello on first run. Put it back to 0
; if you'd like to see it again.
Welcomed = 0

; 1 = write an ai-snap.log next to the script for troubleshooting. 0 = off.
; The log records what happened, never what you copied - it says "attached:
; Text (312 bytes)", not the text. Still, leave it off unless you're chasing
; something.
Debug = 0
