; ============================================================================
;  ClaudeSnap settings — this is the ONLY file you edit.
;  After changing anything: save, then right-click the tray icon > "Reload".
;
;  Hotkey symbols:
;     ^ = Ctrl     ! = Alt     + = Shift     # = Windows key
;  Examples:
;     ^!s   = Ctrl + Alt + S
;     +#a   = Shift + Win + A
;     <^<!s = LEFT Ctrl + LEFT Alt + S   (force the left-hand keys)
; ============================================================================

[Hotkeys]
; Snip a region of your screen and drop it into Claude's message box.
SnipAndSend = !1

; Paste whatever is on your clipboard (text or an image) into Claude.
SendClipboard = !2

; Post / send the current message (presses Enter inside Claude).
Post = !3

[Behavior]
; 1 = jump back to whatever you were doing after each action (recommended).
; 0 = stay focused on the Claude window.
RestoreFocus = 1

; 1 = post the screenshot the instant you finish snipping (skips the Post key).
; 0 = drop it in the box so you can add text first, then press Post.
AutoPostOnSnip = 0

; 1 = write a claudesnap.log next to the script for troubleshooting. 0 = off.
Debug = 0

[Claude]
; How to find the Claude desktop window. The default fits the normal install
; and works even when Claude is minimised or hidden in the system tray.
WinMatch = Claude ahk_exe Claude.exe

; Used to re-open Claude if it's completely closed. Find yours by running
;   Get-StartApps | Where-Object Name -like "*Claude*"
; in PowerShell. Leave blank to never auto-launch.
LaunchID = Claude_pzs8sxrjxfjjc!Claude
